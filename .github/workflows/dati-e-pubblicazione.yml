name: Dati metano e pubblicazione

on:
  schedule:
    # Due aggiornamenti al giorno (orari UTC): il file MIMIT non ha un orario di
    # pubblicazione garantito, il secondo passaggio recupera eventuali ritardi.
    - cron: '15 7 * * *'
    - cron: '15 15 * * *'
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci

      - name: Test
        run: npm test

      - name: Scarica i file MIMIT
        # Il sito MIMIT rifiuta le connessioni dai server di GitHub: i file passano dal
        # proxy Cloudflare (cloudflare/mimit-proxy.js), indicato dai segreti del repository
        # MIMIT_PROXY_URL e MIMIT_PROXY_TOKEN. Senza segreti si prova il sito diretto.
        id: mimit
        continue-on-error: true
        env:
          PROXY_URL: ${{ secrets.MIMIT_PROXY_URL }}
          PROXY_TOKEN: ${{ secrets.MIMIT_PROXY_TOKEN }}
        run: |
          mkdir -p "$RUNNER_TEMP/mimit"
          if [ -n "$PROXY_URL" ]; then
            base="${PROXY_URL%/}/"; auth=(-H "X-Proxy-Token: $PROXY_TOKEN"); src="proxy Cloudflare"
          else
            base="https://www.mimit.gov.it/images/exportCSV/"; auth=(); src="sito MIMIT diretto"
          fi
          echo "Fonte: $src"
          for f in anagrafica_impianti_attivi.csv prezzo_alle_8.csv; do
            if ! curl -sS -L --fail "${auth[@]}" -A "Mozilla/5.0 (compatible; viaggi-metano-data/1.0)" \
                 --connect-timeout 30 --max-time 180 --retry 2 --retry-delay 15 --retry-all-errors \
                 -o "$RUNNER_TEMP/mimit/$f" "$base$f"; then
              echo "::error title=Download MIMIT::$f non scaricabile ($src)"
              exit 1
            fi
            echo "$f: $(wc -c < "$RUNNER_TEMP/mimit/$f") byte, $(head -c 40 "$RUNNER_TEMP/mimit/$f" | head -n 1)"
          done

      - name: Aggiorna dati MIMIT + OSM
        # Se l'aggiornamento fallisce (fonte irraggiungibile, formato cambiato) il sito
        # viene comunque pubblicato con i dati precedenti: l'app mostra la loro data e
        # avvisa quando sono vecchi. L'errore compare come annotazione dell'esecuzione.
        id: data
        if: steps.mimit.outcome == 'success'
        continue-on-error: true
        run: node scripts/build-data.mjs --mimit-dir "$RUNNER_TEMP/mimit"

      - name: Salva i dati nel repository
        if: steps.data.outcome == 'success'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data data-cache
          if git diff --cached --quiet; then
            echo "Nessuna modifica ai dati"
          else
            git commit -m "Dati metano $(date -u +%F)"
            git push
          fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
