name: Dati metano e pubblicazione

on:
  schedule:
    # Due aggiornamenti al giorno (orari UTC): il file MIMIT non ha un orario di
    # pubblicazione garantito, il secondo passaggio recupera eventuali ritardi.
    - cron: '15 7 * * *'
    - cron: '15 15 * * *'
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci

      - name: Test
        run: npm test

      - name: Aggiorna dati MIMIT + OSM
        # Se l'aggiornamento fallisce (fonte irraggiungibile, formato cambiato) il sito
        # viene comunque pubblicato con i dati precedenti: l'app mostra la loro data e
        # avvisa quando sono vecchi. L'errore compare come annotazione dell'esecuzione.
        id: data
        continue-on-error: true
        run: npm run build-data

      - name: Salva i dati nel repository
        if: steps.data.outcome == 'success'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data data-cache
          if git diff --cached --quiet; then
            echo "Nessuna modifica ai dati"
          else
            git commit -m "Dati metano $(date -u +%F)"
            git push
          fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
