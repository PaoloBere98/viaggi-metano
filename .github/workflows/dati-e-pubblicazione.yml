name: Dati metano e pubblicazione

on:
  schedule:
    # Due aggiornamenti al giorno (orari UTC): il file MIMIT non ha un orario di
    # pubblicazione garantito, il secondo passaggio recupera eventuali ritardi.
    - cron: '15 7 * * *'
    - cron: '15 15 * * *'
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci

      - name: Test
        run: npm test

      - name: Scarica i file MIMIT
        # curl con timeout di connessione lungo e più tentativi: il sito MIMIT dai server
        # di GitHub può essere lento ad accettare connessioni.
        id: mimit
        continue-on-error: true
        run: |
          mkdir -p "$RUNNER_TEMP/mimit"
          for f in anagrafica_impianti_attivi.csv prezzo_alle_8.csv; do
            if ! curl -sS -L --fail -A "Mozilla/5.0 (compatible; viaggi-metano-data/1.0)" \
                 --connect-timeout 60 --max-time 300 --retry 4 --retry-delay 20 --retry-all-errors \
                 -o "$RUNNER_TEMP/mimit/$f" "https://www.mimit.gov.it/images/exportCSV/$f"; then
              echo "::error title=Download MIMIT::$f non scaricabile dai server di GitHub"
              exit 1
            fi
            echo "$f: $(wc -c < "$RUNNER_TEMP/mimit/$f") byte"
          done

      - name: Aggiorna dati MIMIT + OSM
        # Se l'aggiornamento fallisce (fonte irraggiungibile, formato cambiato) il sito
        # viene comunque pubblicato con i dati precedenti: l'app mostra la loro data e
        # avvisa quando sono vecchi. L'errore compare come annotazione dell'esecuzione.
        id: data
        if: steps.mimit.outcome == 'success'
        continue-on-error: true
        run: node scripts/build-data.mjs --mimit-dir "$RUNNER_TEMP/mimit"

      - name: Salva i dati nel repository
        if: steps.data.outcome == 'success'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data data-cache
          if git diff --cached --quiet; then
            echo "Nessuna modifica ai dati"
          else
            git commit -m "Dati metano $(date -u +%F)"
            git push
          fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
